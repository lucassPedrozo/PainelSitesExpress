# Gerado pelo painel Joinvix Deploy. Alteracoes manuais serao sobrescritas.
# joinvix-deploy-template: __DEV_AREA_TEMPLATE_VERSION__
# Publica o site na area de desenvolvimento a cada push: e o link que o cliente
# recebe para aprovar. O dominio do cliente e outro workflow (Deploy-via-FTP).
# Actions fixadas por commit (a tag ao lado e so referencia): uma tag pode ser
# movida para outro codigo, e estes passos recebem a senha do FTP.
name: Area de desenvolvimento

on:
  push:
    branches:
      - __DEFAULT_BRANCH__
  workflow_dispatch:

concurrency:
  group: dev-area-${{ github.ref }}
  # Um envio pela metade deixaria a pasta com arquivos de duas versoes; o push
  # seguinte espera a vez.
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to the dev area
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      BASE_PATH: __DEV_BASE_PATH__

    steps:
      - name: Guard branch
        if: github.ref_name != '__DEFAULT_BRANCH__'
        shell: bash
        run: |
          echo "::error::A area de desenvolvimento publica apenas a branch padrao do repositorio."
          exit 1

      - name: Validate deployment configuration
        id: config
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.DEV_AREA_FTP_SERVER }}
          FTP_LOGIN: ${{ secrets.DEV_AREA_FTP_LOGIN }}
          FTP_PASSWORD: ${{ secrets.DEV_AREA_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.DEV_AREA_FTP_PORT }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_LOGIN FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::O secret DEV_AREA_$name nao esta configurado. O painel grava os secrets ao configurar a area de desenvolvimento."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "port=${FTP_PORT:-21}" >> "$GITHUB_OUTPUT"
          echo "Destino remoto: __DEV_SERVER_DIR__"
          echo "Endereco: __DEV_PUBLIC_URL__"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          __DETECT_PACKAGE_MANAGER__

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: ${{ steps.package-manager.outputs.cache }}

      - name: Setup Bun
        if: steps.package-manager.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Enable Corepack
        if: steps.package-manager.outputs.manager == 'pnpm' || steps.package-manager.outputs.manager == 'yarn'
        shell: bash
        run: corepack enable

      - name: Prepare the dev area folder
        shell: bash
        run: |
          __PREPARE_DEV_AREA__

      - name: Ensure static build
        shell: bash
        run: |
          __ENSURE_STATIC_BUILD__

      - name: Install dependencies and build
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ steps.package-manager.outputs.manager }}
          BUILD_ENV_FILE: ${{ secrets.BUILD_ENV_FILE }}
        run: |
          __INSTALL_AND_BUILD__

      - name: Resolve build output
        id: build-output
        shell: bash
        env:
          PUBLISH_DIR: ${{ vars.PUBLISH_DIR }}
          SPA_FALLBACK: ${{ vars.SPA_FALLBACK }}
        run: |
          __RESOLVE_BUILD_OUTPUT__

      - name: Ensure Joinvix signature
        shell: bash
        env:
          DIST_DIR: ${{ steps.build-output.outputs.dist-dir }}
        run: |
          __ENSURE_JOINVIX_SIGNATURE__

      - name: Finish the dev area build
        shell: bash
        env:
          DIST_DIR: ${{ steps.build-output.outputs.dist-dir }}
        run: |
          __FINALIZE_DEV_AREA__

      - name: Select transfer protocol
        id: protocol
        shell: bash
        env:
          FTP_PROTOCOL: ${{ secrets.DEV_AREA_FTP_PROTOCOL }}
          FTP_SERVER: ${{ secrets.DEV_AREA_FTP_SERVER }}
          FTP_LOGIN: ${{ secrets.DEV_AREA_FTP_LOGIN }}
          FTP_PASSWORD: ${{ secrets.DEV_AREA_FTP_PASSWORD }}
          FTP_PORT: ${{ steps.config.outputs.port }}
        run: |
          __SELECT_FTP_PROTOCOL__

      - name: Upload via FTP
        id: upload
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.DEV_AREA_FTP_SERVER }}
          username: ${{ secrets.DEV_AREA_FTP_LOGIN }}
          password: ${{ secrets.DEV_AREA_FTP_PASSWORD }}
          port: ${{ steps.config.outputs.port }}
          protocol: ${{ steps.protocol.outputs.protocol }}
          local-dir: ${{ steps.build-output.outputs.dist-dir }}/
          server-dir: __DEV_SERVER_DIR__
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db

      - name: Publication summary
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            {
              echo "### Area de desenvolvimento nao atualizada"
              echo ""
              echo "Nenhum arquivo foi enviado. O passo que falhou esta destacado acima."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Area de desenvolvimento atualizada"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Endereco | __DEV_PUBLIC_URL__ |"
            echo "| Pasta remota | \`__DEV_SERVER_DIR__\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
